<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Pexeso pre deti</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎴</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-decor" aria-hidden="true">
  <span class="floatie f1">⭐</span>
  <span class="floatie f2">🎈</span>
  <span class="floatie f3">🌈</span>
  <span class="floatie f4">✨</span>
  <span class="floatie f5">☁️</span>
  <span class="floatie f6">🎈</span>
</div>

<header class="topbar">
  <button id="btn-home" class="icon-btn" title="Domov" aria-label="Domov">🏠</button>
  <h1 class="logo">🎴 Pexeso pre deti</h1>
  <button id="btn-mute" class="icon-btn" title="Zvuk" aria-label="Zvuk">🔊</button>
</header>

<main id="app">

  <!-- CATEGORY SELECT -->
  <section id="screen-categories" class="screen active">
    <h2 class="screen-title">Vyber si kategóriu</h2>
    <p class="screen-sub">Od jednoduchých tvarov až po rozprávkové postavičky!</p>
    <div id="category-grid" class="category-grid"></div>
  </section>

  <!-- LEVEL SELECT -->
  <section id="screen-levels" class="screen">
    <button class="back-btn" data-back="categories">⬅ Späť</button>
    <h2 class="screen-title" id="levels-title">Úrovne</h2>
    <div id="level-grid" class="level-grid"></div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen">
    <div class="game-hud">
      <button class="back-btn" data-back="levels">⬅ Späť</button>
      <div class="hud-stat">⏱ <span id="hud-time">0:00</span></div>
      <div class="hud-stat">🔄 <span id="hud-moves">0</span></div>
      <div class="hud-stat">🃏 <span id="hud-pairs">0/0</span></div>
      <button id="btn-restart" class="icon-btn" title="Reštart" aria-label="Reštart">🔁</button>
    </div>
    <div id="board" class="board"></div>
  </section>

</main>

<!-- WIN MODAL -->
<div id="modal-win" class="modal-overlay">
  <div class="modal-card">
    <div class="confetti" id="confetti"></div>
    <h2>🎉 Výborne! 🎉</h2>
    <p id="win-summary"></p>
    <div class="stars-row" id="win-stars">
      <span class="star">⭐</span><span class="star">⭐</span><span class="star">⭐</span>
    </div>
    <div class="modal-actions">
      <button id="btn-replay" class="btn btn-secondary">🔁 Znova</button>
      <button id="btn-next-level" class="btn btn-primary">Ďalšia úroveň ➡</button>
    </div>
    <button id="btn-to-levels" class="btn btn-link">Späť na úrovne</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
